name: Show Kimi section first in teacher navigation
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-neuro-visible.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: bash scripts/check-project-documentation.sh HEAD^ HEAD
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: f659ec5258d8ae1e9ef911af8b51230cb36924c1
          path: source
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 0c84ff9bd0da5fb052f8e59ff5589076beb74d99
          path: previous
      - name: Syntax and anchor
        run: |
          node --check source/timecode-bot/static/neuro.js
          grep -Fq 'dock.prepend(button)' source/timecode-bot/static/neuro.js
          grep -Fq 'neuro.js?v=20261020-menu2' source/timecode-bot/static/index.html
      - name: Connect
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Addressed UI update
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'install -d -m 700 /tmp/timecode-neuro-visible'
          scp -i ~/.ssh/timecode source/timecode-bot/static/neuro.js source/timecode-bot/static/index.html root@217.149.24.242:/tmp/timecode-neuro-visible/
          scp -i ~/.ssh/timecode previous/timecode-bot/static/neuro.js root@217.149.24.242:/tmp/timecode-neuro-visible/previous-neuro.js
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          cmp static/neuro.js /tmp/timecode-neuro-visible/previous-neuro.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('static/index.html').read_text()
          assert s.count('neuro.js?v=20261020"')==1
          assert s.replace('neuro.js?v=20261020"','neuro.js?v=20261020-menu2"')==Path('/tmp/timecode-neuro-visible/index.html').read_text()
          PY
          backup=$(mktemp -d /opt/timecode-bot/neuro-visible-backup-XXXXXXXX)
          chmod 700 "$backup"
          cp -p static/neuro.js static/index.html "$backup/"
          rollback() { cp -p "$backup/neuro.js" "$backup/index.html" static/; }
          trap rollback ERR
          install -m 0644 /tmp/timecode-neuro-visible/neuro.js static/neuro.js
          install -m 0644 /tmp/timecode-neuro-visible/index.html static/index.html
          cmp static/neuro.js /tmp/timecode-neuro-visible/neuro.js
          cmp static/index.html /tmp/timecode-neuro-visible/index.html
          curl -fsS --max-time 12 http://127.0.0.1:8097/health -o /dev/null
          curl -fsS --max-time 12 https://timecode-lab.ru/tc/health -o /dev/null
          curl -fsS --max-time 12 https://timecode-lab.ru/tc/ | grep -Fq 'neuro.js?v=20261020-menu2'
          trap - ERR
          printf '%s\n' "$backup" > /opt/timecode-bot/neuro-visible-latest-backup-path
          echo 'NEURO_FIRST_MENU_LIVE_OK'
          REMOTE
