name: Stop TIMECODE text quest preview
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-stop-preview-20260924.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel text draft delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/mityademon-rgb/news/actions/runs/36007920176/cancel || true
