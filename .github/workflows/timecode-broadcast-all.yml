name: TIMECODE all subscriber delivery
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-broadcast-all.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: feature/timecode-media-bot
          path: source
      - name: Verify subscriber and broadcast behavior
        run: |
          cd source/timecode-bot
          python3 -m unittest discover -s tests -p test_server.py -k broadcast_reaches
          python3 -m unittest discover -s tests -p test_server.py -k subscriber_report
      - name: Update delivery and report with rollback
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          for attempt in 1 2 3 4; do
            if scp -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 source/timecode-bot/server.py root@217.149.24.242:/tmp/timecode-broadcast-all-source.py; then break; fi
            sleep 4
          done
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          backup=$(mktemp /opt/timecode-bot/broadcast-all-XXXXXXXX.py)
          cp -p server.py "$backup"
          rollback() { cp -p "$backup" server.py; systemctl restart timecode-bot.service || true; }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/tmp/timecode-broadcast-all-source.py').read_text()
          live=Path('server.py').read_text()
          for start,end in [('def publish_to_all(','def ask_admins('),
                            ('def subscriber_report(','def allowed(')]:
              if any(s.count(start)!=1 or s.count(end)!=1 for s in (live,source)):
                  raise RuntimeError('Handler anchor changed')
              live=live[:live.index(start)]+source[source.index(start):source.index(end)]+live[live.index(end):]
          Path('server.py').write_text(live)
          PY
          python3 -m py_compile server.py
          systemctl restart timecode-bot.service
          healthy=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 3 http://127.0.0.1:8097/health -o /dev/null; then healthy=1;break;fi
            sleep 2
          done
          test "$healthy" = 1
          systemctl is-active --quiet timecode-bot.service
          python3 - <<'PY'
          import os,sys,runpy
          from pathlib import Path
          for line in Path('/etc/timecode-bot.env').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key,value=line.split('=',1);os.environ[key.strip()]=value.strip().strip('"').strip("'")
          sys.path.insert(0,str(Path.cwd()))
          bot=runpy.run_path('server.py',run_name='timecode_report_notify')
          admins=bot['ADMINS']
          if len(admins)!=1:raise RuntimeError('Admin count changed')
          report=bot['subscriber_report'](next(iter(admins)))
          if not (report or {}).get('ok'):raise RuntimeError('Subscriber report not delivered')
          print('Updated subscribers report delivered privately')
          PY
          trap - ERR
          echo 'Manual admin broadcast covers all subscribers; report labels checkin opt-out accurately'
          REMOTE
