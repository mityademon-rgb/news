name: Audit TIMECODE lessons
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-schedule-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read TIMECODE lessons only
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 "python3 -c 'import sqlite3; c=sqlite3.connect(\"/var/lib/timecode-bot/timecode.db\"); print(*c.execute(\"select id,lab,weekday,start,title,place,enabled from lessons order by weekday,lab,start\").fetchall(),sep=chr(10))'"
