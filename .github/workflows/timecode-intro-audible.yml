name: TIMECODE intro audible playback fix
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-intro-audible.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: feature/timecode-media-bot
          path: source
      - name: Verify script
        run: node --check source/timecode-bot/static/intro.js
      - name: Deploy audible intro with rollback
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          for attempt in 1 2 3 4; do
            if scp -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 -o ConnectTimeout=8 source/timecode-bot/static/intro.js root@217.149.24.242:/tmp/timecode-intro-audible.js; then break; fi
            sleep 4
          done
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 -o ConnectTimeout=8 root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          backup=$(mktemp -d /opt/timecode-bot/intro-audible-backup-XXXXXXXX)
          cp -p static/index.html "$backup/index.html"
          cp -p static/intro.js "$backup/intro.js"
          rollback() { cp -p "$backup/index.html" static/index.html; cp -p "$backup/intro.js" static/intro.js; }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/index.html')
          doc=p.read_text()
          old='src="intro.mp4" autoplay muted playsinline preload="auto"'
          if doc.count(old)!=1:raise RuntimeError('Unexpected intro video markup')
          p.write_text(doc.replace(old,'src="intro.mp4" playsinline preload="auto"'))
          PY
          cp -p /tmp/timecode-intro-audible.js static/intro.js
          curl -fsS http://127.0.0.1:8097/ | grep -q 'id="intro-sound"'
          curl -fsS http://127.0.0.1:8097/intro.js | grep -q 'Запустить со звуком'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/intro.mp4)" = 200
          public_ok=0
          for attempt in 1 2 3 4 5; do
            if test "$(curl -ksS --max-time 5 -o /dev/null -w '%{http_code}' https://timecode-lab.ru/tc/)" = 200; then public_ok=1; break; fi
            sleep 2
          done
          test "$public_ok" = 1
          systemctl is-active --quiet timecode-bot.service
          trap - ERR
          echo 'Audible intro ready; mute toggle and playback fallback deployed'
          REMOTE
