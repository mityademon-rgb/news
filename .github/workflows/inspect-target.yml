name: Diagnose AI Producer on CRM

on:
  workflow_dispatch:
  push:
    branches:
      - boom-kadr-deploy
    paths:
      - '.github/workflows/inspect-target.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure gateway SSH
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/boom_kadr
          chmod 600 ~/.ssh/boom_kadr
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Read-only CRM producer diagnostics
        run: |
          ssh -i ~/.ssh/boom_kadr -o BatchMode=yes root@217.149.24.242 "ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no root@72.56.39.33 \"hostname; date -Is; uptime; df -h /; echo ====PM2====; pm2 status --no-color 2>&1 || true; echo ====SYSTEMD====; systemctl list-units --type=service --all --no-pager 2>&1 | grep -Ei 'ptk|producer|crm|tour' || true; echo ====DIR====; cd /var/www/ptk-crm 2>/dev/null && pwd && git status --short --branch && git log -12 --date=iso --pretty='%h %ad %s' || true; echo ====ENV====; cd /var/www/ptk-crm 2>/dev/null && for k in PUBLIC_BASE_URL PRODUCER_SCHEDULER_ENABLED WORDPRESS_SITE_URL WORDPRESS_USERNAME WORDPRESS_APP_PASSWORD ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY; do if grep -Eq \"^\\\$k=.+\" .env 2>/dev/null; then echo \"\\\$k=SET\"; elif grep -Eq \"^\\\$k=\" .env 2>/dev/null; then echo \"\\\$k=EMPTY\"; else echo \"\\\$k=MISSING\"; fi; done; echo ====CODEFILES====; cd /var/www/ptk-crm 2>/dev/null && grep -RIlE 'маршрут|город|route|city|autopublish|auto.publish|publish.*wordpress|wordpress.*publish' --exclude-dir=node_modules --exclude-dir=.git --exclude='*.sqlite*' . 2>/dev/null | head -120 || true; echo ====DBFILES====; cd /var/www/ptk-crm 2>/dev/null && find . -maxdepth 3 -type f \\( -name '*.sqlite' -o -name '*.db' \\) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\\n' 2>/dev/null | sort || true; echo ====RUNS====; cd /var/www/ptk-crm 2>/dev/null && sqlite3 -header -column data/crm.sqlite \"SELECT id,cycle_type,status,started_at,finished_at,substr(summary,1,100) summary,substr(error,1,160) error FROM producer_runs ORDER BY started_at DESC LIMIT 30;\" 2>&1 || true; echo ====ACTIONS====; cd /var/www/ptk-crm 2>/dev/null && sqlite3 -header -column data/crm.sqlite \"SELECT id,substr(title,1,80) title,action_type,status,requires_approval,scheduled_at,started_at,completed_at,updated_at FROM producer_actions ORDER BY updated_at DESC LIMIT 50;\" 2>&1 || true; echo ====INTEGRATIONS====; cd /var/www/ptk-crm 2>/dev/null && sqlite3 -header -column data/crm.sqlite \"SELECT provider,status,account_label,last_sync_at,substr(last_error,1,180) last_error,updated_at FROM producer_integrations ORDER BY provider;\" 2>&1 || true; echo ====TABLES====; cd /var/www/ptk-crm 2>/dev/null && sqlite3 data/crm.sqlite \"SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'producer_%' OR name LIKE '%route%' OR name LIKE '%city%' OR name LIKE '%publish%') ORDER BY name;\" 2>&1 || true; echo ====CRON====; crontab -l 2>/dev/null | grep -Ei 'ptk|producer|crm|wordpress|route|city|tour|маршрут|город' || true; systemctl list-timers --all --no-pager 2>&1 | grep -Ei 'ptk|producer|crm|wordpress|route|city|tour' || true; echo ====LOGS====; pm2 logs --lines 2200 --nostream --no-color 2>&1 | grep -Ei 'producer|wordpress|scheduler|publish|route|city|маршрут|город|error|exception|sqlite|EACCES|ECONN|401|403|429|500' | tail -n 500 || true; echo ====HEALTH====; curl -ksS --max-time 10 https://crm.1tourtv.ru/api/health || true; echo; echo ====MCP====; curl -ksS -o /tmp/mcpcheck -w 'HTTP=%{http_code}\\n' --max-time 10 -X POST https://crm.1tourtv.ru/mcp -H 'Content-Type: application/json' -d '{\\\"jsonrpc\\\":\\\"2.0\\\",\\\"id\\\":1,\\\"method\\\":\\\"initialize\\\",\\\"params\\\":{\\\"protocolVersion\\\":\\\"2025-06-18\\\",\\\"capabilities\\\":{},\\\"clientInfo\\\":{\\\"name\\\":\\\"diag\\\",\\\"version\\\":\\\"1\\\"}}}' || true; head -c 500 /tmp/mcpcheck 2>/dev/null; echo; echo ====NODE====; ps -eo pid,lstart,etimes,cmd --sort=-lstart | grep -E 'node|pm2' | grep -v grep | head -50 || true\""
