name: Inspect CRM path via existing server

on:
  workflow_dispatch:
  push:
    branches:
      - boom-kadr-deploy
    paths:
      - '.github/workflows/inspect-target.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/boom_kadr
          chmod 600 ~/.ssh/boom_kadr
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Inspect CRM access read-only
        run: |
          ssh -i ~/.ssh/boom_kadr -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set +e
          echo "=== CURRENT HOST ==="
          hostname
          echo "=== LOCAL PTK CRM ==="
          if [ -d /var/www/ptk-crm ]; then
            echo "FOUND /var/www/ptk-crm"
            ls -ld /var/www/ptk-crm
          else
            echo "NO_LOCAL_PTK_CRM"
          fi
          echo "=== ROOT SSH KEY FILES ==="
          find /root/.ssh -maxdepth 1 -type f -printf '%f mode=%m size=%s\n' 2>/dev/null | sort || true
          echo "=== TRY DEFAULT INTER-SERVER SSH TO CRM HOST ==="
          timeout 12 ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@72.56.39.33 'printf "ACCESS_OK "; hostname; whoami' 2>&1 || echo "DEFAULT_ACCESS_FAILED"
          echo "=== TRY EACH PRIVATE KEY FILE WITHOUT PRINTING CONTENT ==="
          for f in /root/.ssh/*; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in
              *.pub|authorized_keys|known_hosts|known_hosts.old|config) continue ;;
            esac
            echo "KEY $(basename "$f")"
            timeout 12 ssh -i "$f" -o BatchMode=yes -o ConnectTimeout=8 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@72.56.39.33 'printf "ACCESS_OK "; hostname; whoami' 2>&1 || echo "ACCESS_FAILED"
          done
          REMOTE
