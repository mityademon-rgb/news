name: Inspect live Producer autopublishing

on:
  workflow_dispatch:
  push:
    branches:
      - boom-kadr-deploy
    paths:
      - '.github/workflows/inspect-target.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure gateway SSH
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/boom_kadr
          chmod 600 ~/.ssh/boom_kadr
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Inspect live autopublishing read-only
        run: |
          printf '%s' '' | base64 -d | ssh -i ~/.ssh/boom_kadr -o BatchMode=yes root@217.149.24.242 "ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no root@72.56.39.33 'bash -s'"
