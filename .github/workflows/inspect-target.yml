name: Diagnose AI Producer on CRM

on:
  workflow_dispatch:
  push:
    branches:
      - boom-kadr-deploy
    paths:
      - '.github/workflows/inspect-target.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure gateway SSH
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/boom_kadr
          chmod 600 ~/.ssh/boom_kadr
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Read-only CRM producer diagnostics
        run: |
          ssh -i ~/.ssh/boom_kadr -o BatchMode=yes root@217.149.24.242 'bash -s' <<'GATEWAY'
          set -Eeuo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=no root@72.56.39.33 'bash -s' <<'CRM'
          set +e
          echo "===== HOST ====="
          hostname
          date -Is
          uptime
          df -h /

          echo "===== PROCESS MANAGERS ====="
          pm2 status --no-color 2>&1 || true
          systemctl list-units --type=service --all --no-pager 2>&1 | grep -Ei 'ptk|producer|crm|tour' || true

          echo "===== APP DIR ====="
          if [ ! -d /var/www/ptk-crm ]; then
            echo "PTK_CRM_DIR_MISSING"
          else
            cd /var/www/ptk-crm
            pwd
            git status --short --branch 2>&1 || true
            git log -12 --date=iso --pretty='%h %ad %s' 2>&1 || true

            echo "===== ENV PRESENCE ONLY ====="
            for k in PUBLIC_BASE_URL PRODUCER_SCHEDULER_ENABLED WORDPRESS_SITE_URL WORDPRESS_USERNAME WORDPRESS_APP_PASSWORD ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY; do
              if [ -f .env ] && grep -Eq "^$k=.+" .env; then
                echo "$k=SET"
              elif [ -f .env ] && grep -Eq "^$k=" .env; then
                echo "$k=EMPTY"
              else
                echo "$k=MISSING"
              fi
            done

            echo "===== PRODUCER / AUTOPUBLISH CODE LOCATIONS ====="
            grep -RIlE 'маршрут|город|route|city|autopublish|auto.publish|publish.*wordpress|wordpress.*publish'               --exclude-dir=node_modules --exclude-dir=.git --exclude='*.sqlite*' . 2>/dev/null | sed -n '1,160p' || true

            echo "===== SCHEDULER CODE ====="
            sed -n '1,220p' src/producer/scheduler.js 2>/dev/null || true

            echo "===== DATABASE FILES ====="
            find . -maxdepth 3 -type f \( -name '*.sqlite' -o -name '*.db' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort || true

            echo "===== PRODUCER DATABASE SNAPSHOT ====="
            node <<'NODE' 2>&1 || true
const fs=require('fs');
const Database=require('better-sqlite3');
const candidates=['data/crm.sqlite','crm.db','data/producer.sqlite'];
const file=candidates.find(f=>fs.existsSync(f));
if(!file){console.log('NO_DB_FOUND');process.exit(0);}
console.log('DB',file);
const db=new Database(file,{readonly:true,fileMustExist:true});
const tables=db.prepare("SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'producer_%' OR name LIKE '%route%' OR name LIKE '%city%' OR name LIKE '%publish%' OR name LIKE '%content%') ORDER BY name").all();
console.log('TABLES',JSON.stringify(tables,null,2));
function all(label,sql){
  try{console.log(label,JSON.stringify(db.prepare(sql).all(),null,2));}
  catch(e){console.log(label+'_ERROR',e.message);}
}
all('RUNS',"SELECT id,cycle_type,status,started_at,finished_at,summary,error FROM producer_runs ORDER BY started_at DESC LIMIT 40");
all('ACTIONS',"SELECT id,title,action_type,status,requires_approval,scheduled_at,started_at,completed_at,updated_at,result_json FROM producer_actions ORDER BY updated_at DESC LIMIT 60");
all('INTEGRATIONS',"SELECT provider,status,account_label,external_id,last_sync_at,last_error,updated_at FROM producer_integrations ORDER BY provider");
all('CONTENT',"SELECT external_id,content_type,title,url,status,published_at,modified_at,synced_at FROM producer_content_items WHERE provider='wordpress' ORDER BY COALESCE(NULLIF(modified_at,''),published_at) DESC LIMIT 30");
db.close();
NODE
          fi

          echo "===== CRON / TIMERS ====="
          systemctl list-timers --all --no-pager 2>&1 | grep -Ei 'ptk|producer|crm|wordpress|route|city|tour' || true
          echo "--- root crontab filtered ---"
          crontab -l 2>/dev/null | grep -Ei 'ptk|producer|crm|wordpress|route|city|tour|маршрут|город' || true
          echo "--- cron.d filenames/content matches ---"
          grep -RInE 'ptk|producer|crm|wordpress|route|city|tour' /etc/cron.d /etc/cron.* 2>/dev/null | tail -n 120 || true

          echo "===== LOG FILES ====="
          find /root/.pm2/logs /var/log -maxdepth 2 -type f 2>/dev/null | grep -Ei 'ptk|crm|producer' | head -80 || true

          echo "===== PM2 LOGS FILTERED ====="
          pm2 logs --lines 2500 --nostream --no-color 2>&1 | grep -Ei 'producer|wordpress|scheduler|publish|route|city|маршрут|город|error|exception|sqlite|EACCES|ECONN|401|403|429|500' | tail -n 600 || true

          echo "===== JOURNAL FILTERED SINCE SEP16 ====="
          journalctl --since '2026-09-16 00:00:00' --no-pager 2>&1 | grep -Ei 'producer|wordpress|scheduler|publish|route|city|маршрут|город|error|exception|sqlite|EACCES|ECONN|401|403|429|500' | tail -n 600 || true

          echo "===== PUBLIC HEALTH ====="
          curl -ksS --max-time 10 https://crm.1tourtv.ru/api/health 2>&1 || true
          echo
          echo "===== MCP UNAUTH CHECK ====="
          curl -ksS -o /tmp/mcpcheck -w 'HTTP=%{http_code}\n' --max-time 10 -X POST https://crm.1tourtv.ru/mcp             -H 'Content-Type: application/json'             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"diag","version":"1"}}}' || true
          head -c 500 /tmp/mcpcheck 2>/dev/null; echo

          echo "===== RECENT NODE PROCESSES ====="
          ps -eo pid,lstart,etimes,cmd --sort=-lstart | grep -E 'node|pm2' | grep -v grep | head -50 || true
          CRM
          GATEWAY
