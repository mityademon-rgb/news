name: Refine TIMECODE Kimi workshop planning
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-neuro-quality.yml']
permissions:
  contents: read
concurrency:
  group: timecode-neuro-quality
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify documentation and code before SSH
        run: bash scripts/check-project-documentation.sh HEAD^ HEAD
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: f73d3e94ad0ae7e5568dca1e6af760c64d6e887e
          path: source
      - name: Run bounded tests
        working-directory: source/timecode-bot
        run: |
          python3 -m unittest discover -s tests -p test_neuro_advisor.py
          python3 -m py_compile neuro_advisor.py
      - name: Connect to TIMECODE
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Addressed module update, backup, health and real Kimi check
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/timecode -o BatchMode=yes source/timecode-bot/neuro_advisor.py source/timecode-bot/NEURO_ADVISOR.md scripts/probe-neuro-advisor.py root@217.149.24.242:/tmp/timecode-neuro-source/
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ServerAliveInterval=10 root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          old=Path('neuro_advisor.py')
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='f6d40cdefd544ac07f86bd6de2536f973a069f47447711a7a38c27db3f37fc20', 'Module drift'
          new=Path('/tmp/timecode-neuro-source/neuro_advisor.py')
          assert hashlib.sha256(new.read_bytes()).hexdigest()=='fff332fae0f0c8cbec1555e7492ecfdde89e8b137162b4ef4999fddcaf3be829', 'Unexpected source'
          assert Path('static/neuro.js').is_file() and 'neuro_advisor.install(globals())' in Path('server.py').read_text()
          PY
          backup=$(mktemp -d /opt/timecode-bot/neuro-quality-backup-XXXXXXXX)
          chmod 700 "$backup"
          cp -p neuro_advisor.py NEURO_ADVISOR.md "$backup/"
          rollback() { cp -p "$backup/neuro_advisor.py" "$backup/NEURO_ADVISOR.md" .; systemctl restart timecode-bot.service || true; }
          trap rollback ERR
          install -m 0644 /tmp/timecode-neuro-source/neuro_advisor.py neuro_advisor.py
          install -m 0644 /tmp/timecode-neuro-source/NEURO_ADVISOR.md NEURO_ADVISOR.md
          python3 -m py_compile neuro_advisor.py server.py
          systemctl restart timecode-bot.service
          curl -fsS --retry 8 --retry-delay 2 --retry-connrefused --max-time 12 http://127.0.0.1:8097/health -o /dev/null
          curl -fsS --max-time 12 https://timecode-lab.ru/tc/health -o /dev/null
          systemctl is-active --quiet timecode-bot.service
          trap - ERR
          printf '%s\n' "$backup" > /opt/timecode-bot/neuro-quality-latest-backup-path
          echo 'QUALITY_MODULE_UPDATED_BOTH_HEALTH_OK'
          set -a
          . /etc/timecode-bot.env
          set +a
          python3 -u /tmp/timecode-neuro-source/probe-neuro-advisor.py
          REMOTE
