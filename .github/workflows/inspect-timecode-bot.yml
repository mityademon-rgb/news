name: Inspect TIMECODE bot service
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/inspect-timecode-bot.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Connect using existing server key
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          test -n "$BOOM_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_inspect
          chmod 600 ~/.ssh/timecode_inspect
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Read TIMECODE status and sanitized logs
        run: |
          ssh -i ~/.ssh/timecode_inspect -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          echo '=== SERVICE ==='
          systemctl is-active timecode-bot.service || true
          systemctl show timecode-bot.service -p SubState -p MainPID -p NRestarts || true
          echo '=== HEALTH ==='
          curl -sS --max-time 5 http://127.0.0.1:8097/health || true
          echo
          echo '=== CONFIG PRESENCE (NO VALUES) ==='
          for name in BOT_TOKEN ADMIN_IDS MOONSHOT_API_KEY BASE_URL JOIN_SECRET SECRET; do
            if grep -q "^$name=" /etc/timecode-bot.env 2>/dev/null; then echo "$name: present"; else echo "$name: absent"; fi
          done
          echo '=== TELEGRAM API / WEBHOOK ==='
          python3 - <<'PY'
          import json,urllib.request,sqlite3
          conf=dict(line.strip().split('=',1) for line in open('/etc/timecode-bot.env') if '=' in line)
          token=conf['BOT_TOKEN']
          for method in ('getMe','getWebhookInfo'):
              try:
                  with urllib.request.urlopen('https://api.telegram.org/bot'+token+'/'+method,timeout=8) as r: data=json.load(r)
                  result=data.get('result') or {}
                  if method=='getMe': print('bot username:',result.get('username'), 'ok:',data.get('ok'))
                  else: print('webhook configured:',bool(result.get('url')), 'pending:',result.get('pending_update_count'), 'last error:',str(result.get('last_error_message',''))[:130])
              except Exception as e: print(method+': request failed ('+type(e).__name__+')')
          con=sqlite3.connect('/var/lib/timecode-bot/timecode.db')
          print('registered users:',con.execute('select id,role,joined from users').fetchall())
          print('configured admin ID:',conf.get('ADMIN_IDS'))
          req=urllib.request.Request('https://api.telegram.org/bot'+token+'/sendMessage',data=json.dumps({'chat_id':int(conf['ADMIN_IDS']),'text':'TIMECODE: проверка связи. Бот работает; открой приложение ещё раз.'}).encode(),headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=12) as response: message=json.load(response)
              print('test message delivered:',message.get('ok'),'error:',str(message.get('description',''))[:130])
          except Exception as e: print('test message request failed:',type(e).__name__)
          import hashlib,hmac,time,urllib.parse
          user={'id':int(conf['ADMIN_IDS'])}
          fields={'auth_date':str(int(time.time())),'user':json.dumps(user,separators=(',',':'))}
          check='\n'.join(k+'='+v for k,v in sorted(fields.items()))
          key=hmac.new(b'WebAppData',token.encode(),hashlib.sha256).digest()
          fields['hash']=hmac.new(key,check.encode(),hashlib.sha256).hexdigest()
          auth=urllib.request.Request('http://127.0.0.1:8097/api/auth',data=json.dumps({'initData':urllib.parse.urlencode(fields)}).encode(),headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(auth,timeout=4) as response: print('miniapp auth status:',response.status)
          except Exception as e: print('miniapp auth failure:',type(e).__name__,getattr(e,'code',''))
          PY
          echo '=== SERVICE LOG (REDACTED) ==='
          journalctl -u timecode-bot.service -n 50 --no-pager -o cat 2>&1 | sed -E 's/[0-9]{7,}:[A-Za-z0-9_-]{20,}/[TELEGRAM_TOKEN]/g; s/sk-[A-Za-z0-9_-]{15,}/[API_KEY]/g'
          REMOTE
