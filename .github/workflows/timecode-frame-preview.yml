name: Deploy TIMECODE visual game preview
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-frame-preview.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static preview files only
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BOOM_SSH_KEY"
          mkdir -p ~/.ssh /tmp/timecode-frame-preview
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 >> ~/.ssh/known_hosts
          for file in app.js index.html framequest.js framequest.css; do
            curl --fail --location --retry 3 --max-time 40 "https://raw.githubusercontent.com/mityademon-rgb/media-center-bot/0ae497670dfe1a8d24e67e0869a5a7b879b933a9/timecode-bot/static/$file" -o "/tmp/timecode-frame-preview/$file"
            test -s "/tmp/timecode-frame-preview/$file"
          done
          curl --fail --location --retry 3 --max-time 40 'https://raw.githubusercontent.com/mityademon-rgb/media-center-bot/29d383214115a5f74f8f40dfbc1a61a9aaf46fb0/timecode-bot/server.py' -o /tmp/timecode-frame-preview/server.py
          python3 -m py_compile /tmp/timecode-frame-preview/server.py
          node --check /tmp/timecode-frame-preview/app.js
          node --check /tmp/timecode-frame-preview/framequest.js
          scp -i ~/.ssh/timecode_key -o BatchMode=yes /tmp/timecode-frame-preview/app.js /tmp/timecode-frame-preview/index.html /tmp/timecode-frame-preview/framequest.js /tmp/timecode-frame-preview/framequest.css /tmp/timecode-frame-preview/server.py root@217.149.24.242:/tmp/
          ssh -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 'set -eu; target=/opt/timecode-bot/timecode-bot/static; test -f "$target/app.js"; test -f "$target/index.html"; cp -p "$target/app.js" "$target/app.js.before-frame-preview-20260924"; cp -p "$target/index.html" "$target/index.html.before-frame-preview-20260924"; for file in app.js index.html framequest.js framequest.css; do install -m 0644 "/tmp/$file" "$target/$file"; done; server=/opt/timecode-bot/timecode-bot/server.py; cp -p "$server" "$server.before-frame-preview-20260924"; install -m 0644 /tmp/server.py "$server"; systemctl restart timecode-bot.service; systemctl is-active --quiet timecode-bot.service; for i in 1 2 3 4 5 6 7 8; do if curl -fsS --max-time 3 http://127.0.0.1:8097/health | grep -q timecode-bot && curl -fsS --max-time 3 http://127.0.0.1:8097/framequest.js | grep -q frameLevels; then echo "Visual game preview deployed; service active"; exit 0; fi; sleep 2; done; journalctl -u timecode-bot.service -n 25 --no-pager; exit 1'
