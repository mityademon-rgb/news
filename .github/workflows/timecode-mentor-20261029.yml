name: Upgrade existing Kimi mentor without test messages
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-mentor-20261029.yml']
permissions:
  contents: read
concurrency:
  group: timecode-mentor-20261029
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Offline tests and documentation before SSH
        run: |
          bash scripts/check-project-documentation.sh HEAD~1 HEAD
          git diff --check HEAD~1 HEAD
          cd scripts/mentor-20261029
          python3 -m unittest test_mentor test_games -v
          python3 -m py_compile *.py
      - name: Synthetic AI probes, backup and scoped install
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          ssh -i ~/.ssh/timecode root@217.149.24.242 'install -d -m 700 /tmp/mentor-20261029'
          scp -i ~/.ssh/timecode scripts/mentor-20261029/*.py scripts/mentor-20261029/*.json scripts/mentor-20261029/*.md root@217.149.24.242:/tmp/mentor-20261029/
          ssh -i ~/.ssh/timecode root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          set -a
          . /etc/timecode-bot.env
          set +a
          cd /tmp/mentor-20261029
          python3 deploy.py
          python3 verify.py
          REMOTE
