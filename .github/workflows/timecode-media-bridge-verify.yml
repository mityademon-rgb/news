name: TIMECODE media bridge verification
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-media-bridge-verify.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify existing image download and upload without broadcasting
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ConnectTimeout=8 root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          set -a
          . /etc/timecode-bot.env
          set +a
          python3 - <<'PY'
          import server, shared_media
          from unittest.mock import patch
          with server.conn() as c:
              row=c.execute("select * from shared_photo_assets where url!='' order by rowid desc limit 1").fetchone()
              tg=c.execute("select photo from morning_checkins where photo!='' and photo not like 'max:%' order by day desc limit 1").fetchone()
              max_user=c.execute("select user_id from messenger_identities where platform='max' limit 1").fetchone()
          if row:
              raw=shared_media.download(vars(server),row['photo'],row)
              print('Real MAX image download bytes:',len(raw))
              assert len(raw)>100
          if tg and max_user:
              with patch.object(server.max_transport,'send_image',return_value={'ok':True}) as delivery:
                  result=shared_media.send_photo(vars(server),max_user['user_id'],tg['photo'],'Transport verification')
                  assert result.get('ok')
                  assert delivery.call_args.args[1]
                  print('Real Telegram download and MAX upload: successful; no message sent')
          else:print('No source image available for Telegram/MAX upload verification')
          with server.conn() as c:
              print('Cross-platform cached assets:',c.execute("select count(*) from shared_photo_assets where max_token!='' or tg_file_id!=''").fetchone()[0])
          print('No report or test message published')
          PY
          REMOTE
