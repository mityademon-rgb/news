name: Draft first TIMECODE quest for editorial review
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-first-draft-20260924.yml']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Apply IPv4 Kimi client and prepare private Kids Lab preview
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          timeout 30 ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 'python3 -' <<'PY'
          import os,subprocess,json
          env={}
          for line in open('/etc/timecode-bot.env',encoding='utf-8'):
              if '=' in line and not line.lstrip().startswith('#'):
                  key,value=line.strip().split('=',1);env[key]=value
          result=subprocess.run(['curl','-4','-fsS','--connect-timeout','5','--max-time','12','https://api.telegram.org/bot'+env['BOT_TOKEN']+'/getMe'],capture_output=True,text=True,timeout=15)
          body=json.loads(result.stdout) if result.returncode==0 else {}
          print('Telegram IPv4 reachable:',bool(body.get('ok')),'error code:',result.returncode,flush=True)
          PY
