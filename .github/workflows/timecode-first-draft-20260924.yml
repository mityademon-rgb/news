name: Draft first TIMECODE quest for editorial review
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-first-draft-20260924.yml']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Apply IPv4 Kimi client and prepare private Kids Lab preview
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          timeout 30 ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=12 -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 'python3 -' <<'PY'
          import sqlite3,subprocess
          c=sqlite3.connect('/var/lib/timecode-bot/timecode.db')
          rows=c.execute('select id,lab,status,length(content) from quest_drafts order by id desc limit 5').fetchall()
          print('quest drafts:',rows,flush=True)
          p=subprocess.run(['journalctl','-u','timecode-bot.service','--since','-12 min','--no-pager'],capture_output=True,text=True)
          safe=[line[-180:] for line in p.stdout.splitlines() if ('Quest generation:' in line or 'Telegram:' in line or 'Kimi:' in line)]
          print('service errors:',safe[-5:],flush=True)
          PY
