name: Draft first TIMECODE quest for editorial review
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-first-draft-20260924.yml']
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Kimi for Kids Lab private draft
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          timeout 20 ssh -o ServerAliveInterval=10 -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 'python3 -' <<'PY'
          import os,subprocess,time,socket
          print('dns:',socket.getaddrinfo('api.moonshot.ai',443,proto=socket.IPPROTO_TCP)[0][4][0],flush=True)
          r=subprocess.run(['curl','-sS','-o','/dev/null','-w','%{http_code}','--connect-timeout','4','--max-time','10','https://api.moonshot.ai/v1/models'],capture_output=True,text=True)
          print('API connection:',r.returncode,'HTTP:',r.stdout,flush=True)
          print('stderr:',r.stderr[:100],flush=True)
          PY
