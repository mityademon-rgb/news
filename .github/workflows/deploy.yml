name: Deploy BUM.KADR

on:
  push:
    branches:
      - boom-kadr-deploy
  workflow_dispatch:

concurrency:
  group: boom-kadr-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ secrets.BOOM_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Configure deployment key
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/boom_kadr
          chmod 600 ~/.ssh/boom_kadr
          ssh-keyscan -H 72.56.65.161 >> ~/.ssh/known_hosts

      - name: Upload website
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            -e 'ssh -i ~/.ssh/boom_kadr' \
            ./ root@72.56.65.161:/var/www/boom-kadr/

      - name: Configure and verify Nginx
        run: |
          ssh -i ~/.ssh/boom_kadr root@72.56.65.161 'bash -s' <<'REMOTE'
          set -euo pipefail

          test -s /var/www/boom-kadr/index.html
          chown -R www-data:www-data /var/www/boom-kadr

          if nginx -T 2>&1 | grep -q '/etc/nginx/sites-enabled/'; then
            install -d /etc/nginx/sites-enabled
            config_path=/etc/nginx/sites-enabled/boom-kadr
          elif nginx -T 2>&1 | grep -q '/etc/nginx/conf.d/'; then
            install -d /etc/nginx/conf.d
            config_path=/etc/nginx/conf.d/boom-kadr.conf
          else
            echo 'No supported Nginx include directory found' >&2
            exit 1
          fi

          rm -f /etc/nginx/sites-enabled/boom-kadr /etc/nginx/conf.d/boom-kadr.conf

          if [ -L /etc/nginx/sites-enabled/default ]; then
            rm -f /etc/nginx/sites-enabled/default
          fi

          cat > "$config_path" <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name 72.56.65.161 boom-kadr.72-56-65-161.nip.io _;

              root /var/www/boom-kadr;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(css|js|webp)$ {
                  expires 7d;
                  add_header Cache-Control "public";
              }
          }
          NGINX

          nginx -t
          systemctl reload nginx
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/index.html)" = "200"
          REMOTE
