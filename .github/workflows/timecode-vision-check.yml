name: Verify TIMECODE Kimi vision
on:
  push:
    branches: [boom-kadr-deploy]
    paths: [.github/workflows/timecode-vision-check.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Kimi with synthetic image only
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BOOM_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh-keyscan -T 8 -H 217.149.24.242 >> /tmp/known_hosts 2>/dev/null
          cat > /tmp/check_vision.py <<'PY'
          import os, sys, zlib, struct, base64, subprocess, json
          from pathlib import Path
          pid=int(os.popen('systemctl show -p MainPID --value timecode-bot.service').read().strip())
          if not pid: raise SystemExit('SERVICE_NOT_RUNNING')
          for pair in Path(f'/proc/{pid}/environ').read_bytes().split(b'\0'):
              if b'=' in pair:
                  k,v=pair.split(b'=',1)
                  if k in (b'MOONSHOT_API_KEY',b'KIMI_VISION_MODEL'):
                      os.environ[k.decode()]=v.decode()
          sys.path.insert(0,'/opt/timecode-bot/timecode-bot')
          import server
          if not server.AI_KEY:raise SystemExit('KIMI_KEY_NOT_CONFIGURED')
          def chunk(kind,data):
              return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
          image=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',32,32,8,2,0,0,0))
          image+=chunk(b'IDAT',zlib.compress(b''.join(b'\0'+b'\x9d\x68\xc8'*32 for _ in range(32))))+chunk(b'IEND',b'')
          for model in ('kimi-k2.6','kimi-k3'):
              payload={'model':model,'max_tokens':100,'thinking':{'type':'disabled'},'messages':[{'role':'user','content':[{'type':'text','text':'Назови цвет квадрата одним словом.'},{'type':'image_url','image_url':{'url':'data:image/png;base64,'+base64.b64encode(image).decode()}}]}]}
              proc=subprocess.run(['curl','-4','-sS','--connect-timeout','8','--max-time','35','-H','Content-Type: application/json','-H','Authorization: Bearer '+server.AI_KEY,'--data-binary','@-','https://api.moonshot.ai/v1/chat/completions'],input=json.dumps(payload),capture_output=True,text=True,timeout=40)
              try:result=json.loads(proc.stdout)
              except Exception:print('VISION_BAD_RESPONSE',model,proc.returncode);continue
              if result.get('choices'):
                  print('VISION_WORKS',model)
                  break
              error=result.get('error',{})
              print('VISION_REJECTED',model,str(error.get('type',''))[:60],str(error.get('message',''))[:150].replace(server.AI_KEY,'[redacted]'))
          else:raise SystemExit(1)

          PY
          scp -i /tmp/deploy_key -o UserKnownHostsFile=/tmp/known_hosts /tmp/check_vision.py root@217.149.24.242:/tmp/timecode-vision-check.py
          ssh -i /tmp/deploy_key -o UserKnownHostsFile=/tmp/known_hosts root@217.149.24.242 'python3 /tmp/timecode-vision-check.py; code=$?; rm -f /tmp/timecode-vision-check.py; exit "$code"'
