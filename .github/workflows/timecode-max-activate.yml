name: TIMECODE activate MAX webhook
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-max-activate.yml']
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH setup
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Activate MAX without logging credentials
        run: |
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,secrets,subprocess
          from pathlib import Path
          sealed=''
          key='/etc/timecode-max-private.pem'
          token=subprocess.run(['openssl','pkeyutl','-decrypt','-inkey',key,
                                '-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],
                               input=base64.b64decode(sealed),capture_output=True,check=True).stdout.decode()
          assert 80<=len(token)<=120 and all(c.isalnum() or c in '_-' for c in token)
          def call(method,url,payload=None):
              command=['curl','-4','-fsS','--connect-timeout','8','--max-time','18','-X',method,
                       '-H','Authorization: '+token,'-H','Content-Type: application/json',url]
              if payload is not None:command.extend(['--data-binary','@-'])
              result=subprocess.run(command,input=json.dumps(payload) if payload is not None else None,
                                    capture_output=True,text=True,timeout=23)
              if result.returncode:raise RuntimeError('MAX HTTP transport: '+str(result.returncode))
              return json.loads(result.stdout)
          identity=call('GET','https://platform-api2.max.ru/me')
          if not identity.get('user_id'):raise RuntimeError('MAX credentials rejected')
          env=Path('/etc/timecode-bot.env')
          previous=env.read_text()
          secret=secrets.token_urlsafe(40)
          cleaned=[line for line in previous.splitlines() if not line.startswith(('MAX_BOT_TOKEN=','MAX_WEBHOOK_SECRET='))]
          env.write_text('\n'.join(cleaned)+('\n' if cleaned else '')+
                         'MAX_BOT_TOKEN='+token+'\nMAX_WEBHOOK_SECRET='+secret+'\n')
          env.chmod(0o600)
          try:
              subprocess.run(['systemctl','restart','timecode-bot.service'],check=True,capture_output=True)
              health=subprocess.run(['curl','-fsS','--max-time','6','http://127.0.0.1:8097/health'],
                                    capture_output=True,text=True,check=True)
              assert json.loads(health.stdout).get('ok')
              result=call('POST','https://platform-api2.max.ru/subscriptions',
                          {'url':'https://timecode-lab.ru/tc/api/max/webhook',
                           'update_types':['bot_started','message_created','message_callback'],
                           'secret':secret})
              print('MAX activation: webhook request accepted')
              print('MAX bot id:',identity['user_id'])
          except Exception:
              env.write_text(previous)
              subprocess.run(['systemctl','restart','timecode-bot.service'],capture_output=True)
              raise
          PY
          REMOTE
