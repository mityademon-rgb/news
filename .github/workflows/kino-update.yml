name: Update kino group bot safely
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/kino-update.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure existing server SSH
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/kino
          chmod 600 ~/.ssh/kino
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Update only kino group and verify
        run: |
          ssh -i ~/.ssh/kino -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          test -d /opt/kino-group/.git
          test "$(git -C /opt/kino-group branch --show-current)" = feature/kino-group-miniapp
          git -C /opt/kino-group pull --ff-only
          python3 -m py_compile /opt/kino-group/kino-group/server.py
          systemctl restart kino-group.service
          sleep 2
          test "$(systemctl is-active kino-group.service)" = active
          curl -fsS --max-time 10 http://127.0.0.1:8087/health
          curl -fsS --max-time 12 --resolve group.217-149-24-234.nip.io:443:217.149.24.234 https://group.217-149-24-234.nip.io/health
          REMOTE
      - name: Check existing sites
        run: |
          curl -fsS --max-time 20 https://timecode-lab.ru/ -o /dev/null
          curl -fsS --max-time 20 https://go.1tourtv.ru/ -o /dev/null
          curl -fsS --max-time 20 https://sale.1tourtv.ru/ -o /dev/null
