name: Diagnose TIMECODE app response
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-live-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read public responses and app logs
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode_key
          chmod 600 ~/.ssh/timecode_key
          ssh-keyscan -T 8 -H 217.149.24.242 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/timecode_key -o BatchMode=yes root@217.149.24.242 'for path in / /app.js /framequest.js /nightshift.js /terms-memory.js /style.css /terms-memory.css /api/state; do printf "LOCAL %-21s " "$path"; curl -sS --max-time 4 -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "http://127.0.0.1:8097$path"; done; for path in /tc/ /tc/app.js /tc/terms-memory.js /tc/terms-memory.css /tc/api/state; do printf "PUBLIC %-21s " "$path"; curl -skS --resolve timecode-lab.ru:443:217.149.24.234 --max-time 6 -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "https://timecode-lab.ru$path"; done; systemctl is-active timecode-bot.service; journalctl -u timecode-bot.service -n 10 --no-pager'