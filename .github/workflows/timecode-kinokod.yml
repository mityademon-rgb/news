name: Update TIMECODE KinoKod invitation mechanics
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-kinokod.yml']
permissions:
  contents: read
concurrency:
  group: timecode-kinokod
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 4}
      - name: Documentation guard
        run: bash scripts/check-project-documentation.sh HEAD~1 HEAD
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: a4ec9c397a9c82a52ef588fd2d1664bee5f2d09c
          path: source
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 30cbf260dfc6068f34f9d15c897a8523f1fe84df
          path: previous
      - name: Syntax check
        run: python3 -m py_compile source/timecode-bot/kinokod.py
      - name: Connect
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Address-only update with rollback
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/timecode source/timecode-bot/kinokod.py root@217.149.24.242:/tmp/timecode-kinokod-next.py
          scp -i ~/.ssh/timecode previous/timecode-bot/kinokod.py root@217.149.24.242:/tmp/timecode-kinokod-prev.py
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          cmp kinokod.py /tmp/timecode-kinokod-prev.py
          grep -q 'kinokod.install(globals())' server.py
          backup=$(mktemp -d /opt/timecode-bot/kinokod-update-backup-XXXXXXXX)
          chmod 700 "$backup"
          cp -p kinokod.py "$backup/kinokod.py"
          rollback() {
            cp -p "$backup/kinokod.py" kinokod.py
            systemctl restart timecode-bot.service || true
          }
          trap rollback ERR
          install -m 0644 /tmp/timecode-kinokod-next.py kinokod.py
          python3 -m py_compile kinokod.py
          systemctl restart timecode-bot.service
          curl -fsS --retry 8 --retry-delay 2 --retry-connrefused --max-time 12 http://127.0.0.1:8097/health
          echo "$backup" > /opt/timecode-bot/kinokod-update-latest-backup-path
          trap - ERR
          echo "KinoKod invitations active"
          REMOTE
      - name: Verify public health
        run: curl -fsS --retry 4 --retry-delay 3 --max-time 12 https://timecode-lab.ru/tc/health
