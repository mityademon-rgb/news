name: Deploy TIMECODE KinoKod rich detective and check delivery
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-kinokod.yml']
permissions:
  contents: write
concurrency:
  group: timecode-kinokod
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 12}
      - name: Required documentation guard
        id: guard
        run: bash scripts/check-project-documentation.sh HEAD~3 HEAD
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 85a6d12a89323185da25a536028650b0a1ce4e34
          path: source
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 3a569a6b32cde91ccfa4785fe9c9d31820af7fe6
          path: previous
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: b92dabb11818b32bdf8b7538552c9815e18b7ea2
          path: alternate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bot and render original visual clues
        id: tests
        run: |
          set -Eeuo pipefail
          python -m py_compile source/timecode-bot/kinokod.py
          python -m unittest discover -s source/timecode-bot/tests -p test_kinokod_flow.py -v
          python -m pip install --disable-pip-version-check Pillow
          python scripts/render-kinokod.py
          python - <<'PY'
          import importlib.util,sqlite3
          spec=importlib.util.spec_from_file_location('kinokod','source/timecode-bot/kinokod.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          assert len(mod.RELEASES)==7
          db=sqlite3.connect(':memory:')
          mod.tables(db)
          assert {row[0] for row in db.execute('select name from sqlite_master where type="table"')} >= {'kinokod_players','kinokod_votes','kinokod_visuals','kinokod_posts'}
          PY
          test -s kinokod-images/kinokod--1.png
          test -s kinokod-images/kinokod-0.png
          test -s kinokod-images/kinokod-6.png
      - name: Connect to TIMECODE
        id: connect
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Back up, install rich KinoKod, activate
        id: deploy
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/timecode source/timecode-bot/kinokod.py root@217.149.24.242:/tmp/timecode-kinokod-updated.py
          scp -i ~/.ssh/timecode previous/timecode-bot/kinokod.py root@217.149.24.242:/tmp/timecode-kinokod-previous.py
          scp -i ~/.ssh/timecode alternate/timecode-bot/kinokod.py root@217.149.24.242:/tmp/timecode-kinokod-alternate.py
          scp -i ~/.ssh/timecode kinokod-images/kinokod-*.png root@217.149.24.242:/tmp/
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          grep -Fq 'kinokod.install(globals())' server.py
          if ! cmp -s kinokod.py /tmp/timecode-kinokod-updated.py; then
            if ! cmp -s kinokod.py /tmp/timecode-kinokod-previous.py; then
              cmp kinokod.py /tmp/timecode-kinokod-alternate.py
            fi
          fi
          backup=$(mktemp -d /opt/timecode-bot/kinokod-rich-backup-XXXXXXXX)
          chmod 700 "$backup"
          cp -p kinokod.py "$backup/kinokod.py"
          python3 - "$backup" <<'PYDB'
          import sqlite3,sys
          source=sqlite3.connect('file:/var/lib/timecode-bot/timecode.db?mode=ro',uri=True)
          target=sqlite3.connect(sys.argv[1]+'/timecode.db')
          source.backup(target)
          target.close();source.close()
          PYDB
          chmod 600 "$backup/timecode.db"
          mkdir -m 700 "$backup/static"
          for f in /tmp/kinokod-*.png; do
            name=${f##*/}
            if [ -e "static/$name" ]; then cp -p "static/$name" "$backup/static/$name"; fi
          done
          rollback() {
            cp -p "$backup/kinokod.py" kinokod.py
            for f in /tmp/kinokod-*.png; do
              name=${f##*/}
              if [ -e "$backup/static/$name" ]; then cp -p "$backup/static/$name" "static/$name"; else rm -f "static/$name"; fi
            done
            systemctl restart timecode-bot.service || true
          }
          trap rollback ERR
          install -m 0644 /tmp/timecode-kinokod-updated.py kinokod.py
          for f in /tmp/kinokod-*.png; do install -m 0644 "$f" "static/${f##*/}"; done
          python3 -m py_compile kinokod.py
          systemctl restart timecode-bot.service
          curl -fsS --retry 8 --retry-delay 2 --retry-connrefused --max-time 12 http://127.0.0.1:8097/health
          echo "$backup" >/opt/timecode-bot/kinokod-rich-latest-backup-path
          trap - ERR
          echo 'KinoKod two-step detective narrative installed and bot healthy'
          REMOTE
      - name: Inspect per-platform delivery without exposing children
        id: audit
        run: |
          sleep 45
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'python3 -' <<'PY'
          import json,sqlite3,datetime,pathlib,os
          p=pathlib.Path('/var/lib/timecode-bot/timecode.db')
          db=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True)
          db.row_factory=sqlite3.Row
          stats={'telegram':{},'max':{},'other':{}}
          for row in db.execute("select chat,delivered from notification_outbox where message_key like 'kc-kinokod20261020-%'"):
              try:
                  uid=json.loads(row['chat'])
                  platform='max' if isinstance(uid,int) and uid<0 else 'telegram' if isinstance(uid,int) else 'other'
              except Exception:
                  platform='other'
              key=str(row['delivered'])
              stats[platform][key]=stats[platform].get(key,0)+1
          images={'delivered':0,'pending':0,'total':0}
          try:
              for row in db.execute('select delivered,count(*) as n from kinokod_visuals group by delivered'):
                  images['total']+=row['n']
                  images['delivered' if row['delivered']==1 else 'pending']+=row['n']
          except sqlite3.OperationalError:pass
          joined=db.execute('select count(*) from kinokod_players').fetchone()[0]
          posts=[row['slot'] for row in db.execute('select slot from kinokod_posts order by slot')]
          file=pathlib.Path('/opt/timecode-bot/timecode-bot/kinokod.py')
          steps=db.execute('select count(*) from kinokod_steps').fetchone()[0]
          bridges={}
          for row in db.execute("select delivered,count(*) from notification_outbox where message_key like 'kc-bridge-%' group by delivered"):
              bridges[str(row[0])]=row[1]
          result={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'installed':('CASE_RAILS' in file.read_text() and 'kinokod_steps' in file.read_text()),'outbox':stats,'visuals':images,'joined':joined,'steps_completed':steps,'bridge_receipts':bridges,'released_slots':posts}
          dest=pathlib.Path('/opt/timecode-bot/kinokod-status.json')
          dest.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          os.chmod(dest,0o644)
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Verify public bot HTTP
        id: public
        run: |
          curl -fsS --retry 5 --retry-delay 3 --max-time 15 https://timecode-lab.ru/tc/health

      - name: Record safe workflow outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEP_GUARD: ${{ steps.guard.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
          STEP_CONNECT: ${{ steps.connect.outcome }}
          STEP_DEPLOY: ${{ steps.deploy.outcome }}
          STEP_AUDIT: ${{ steps.audit.outcome }}
          STEP_PUBLIC: ${{ steps.public.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,datetime
          info={'time_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                'run_id':os.getenv('GITHUB_RUN_ID'),'source':'85a6d12a89323185da25a536028650b0a1ce4e34',
                'steps':{k:os.environ.get('STEP_'+k.upper(),'') for k in ('guard','tests','connect','deploy','audit','public')}}
          open('kinokod-ci-status.json','w').write(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
          marker=kinokod-ci-status.json
          base64content=$(base64 -w0 "$marker")
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$marker?ref=boom-kadr-deploy" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" -f message='Record KinoKod deploy outcome' -f content="$base64content" -f branch=boom-kadr-deploy -f sha="$sha" > /dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" -f message='Record KinoKod deploy outcome' -f content="$base64content" -f branch=boom-kadr-deploy > /dev/null
          fi
