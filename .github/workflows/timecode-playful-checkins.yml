name: TIMECODE evening checkin reliable delivery
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-playful-checkins.yml']
permissions:
  contents: read
concurrency:
  group: timecode-evening-checkin
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Project documentation guard
        run: bash scripts/check-project-documentation.sh HEAD^ HEAD
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 4b684d9577bb95fabd775aa2e3be5067984d7df9
          path: source
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: 97743f8cf9e28c6c6abc8a1193788909017c13c1
          path: previous
      - name: Prove evening invitations are queued exactly once
        run: |
          set -Eeuo pipefail
          (cd source/timecode-bot && python3 -m unittest discover -s tests -p test_playful_checkins.py -v)
          python3 -m py_compile source/timecode-bot/playful_checkins.py
      - name: Configure existing TIMECODE deployment connection
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
      - name: Apply only checkin module after exact file check and backup
        run: |
          set -Eeuo pipefail
          scp -i ~/.ssh/timecode source/timecode-bot/playful_checkins.py root@217.149.24.242:/tmp/timecode-playful-checkins-next.py
          scp -i ~/.ssh/timecode previous/timecode-bot/playful_checkins.py root@217.149.24.242:/tmp/timecode-playful-checkins-prev.py
          ssh -i ~/.ssh/timecode -o BatchMode=yes root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          cmp playful_checkins.py /tmp/timecode-playful-checkins-prev.py
          grep -Fq 'playful_checkins.install(globals())' server.py
          backup=$(mktemp -d /opt/timecode-bot/checkin-reliability-backup-XXXXXXXX)
          chmod 700 "$backup"
          cp -p playful_checkins.py "$backup/playful_checkins.py"
          python3 - "$backup" <<'PY'
          import sqlite3,sys
          old=sqlite3.connect('file:/var/lib/timecode-bot/timecode.db?mode=ro',uri=True)
          backup=sqlite3.connect(sys.argv[1]+'/timecode.db')
          old.backup(backup)
          backup.close();old.close()
          PY
          chmod 600 "$backup/timecode.db"
          rollback() {
            cp -p "$backup/playful_checkins.py" playful_checkins.py
            systemctl restart timecode-bot.service || true
          }
          trap rollback ERR
          install -m 0644 /tmp/timecode-playful-checkins-next.py playful_checkins.py
          python3 -m py_compile playful_checkins.py
          systemctl restart timecode-bot.service
          curl -fsS --retry 8 --retry-delay 2 --retry-connrefused --max-time 12 http://127.0.0.1:8097/health
          cmp playful_checkins.py /tmp/timecode-playful-checkins-next.py
          echo "$backup" >/opt/timecode-bot/checkin-reliability-latest-backup-path
          trap - ERR
          echo 'Evening 18:00 queue and recovery path installed'
          REMOTE
      - name: Check public app and bot health
        run: |
          curl -fsS --retry 5 --retry-delay 2 --max-time 12 https://timecode-lab.ru/tc/health
