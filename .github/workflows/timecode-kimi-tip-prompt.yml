name: TIMECODE Kimi daily tip editor
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-kimi-tip-prompt.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mityademon-rgb/media-center-bot
          ref: feature/timecode-media-bot
          path: source
      - name: Test actual 15:00 handler
        run: |
          cd source/timecode-bot
          python3 -m unittest discover -s tests -p test_server.py -k tip
          python3 -m py_compile server.py notification_delivery.py
      - name: Deploy targeted tip generator
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          scp -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 -o ConnectTimeout=8 source/timecode-bot/server.py source/timecode-bot/notification_delivery.py root@217.149.24.242:/tmp/
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ConnectionAttempts=5 -o ConnectTimeout=8 root@217.149.24.242 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/timecode-bot/timecode-bot
          backup=$(mktemp -d /opt/timecode-bot/kimi-tip-backup-XXXXXXXX)
          cp -p server.py notification_delivery.py "$backup/"
          rollback() { cp -p "$backup/server.py" "$backup/notification_delivery.py" .; systemctl restart timecode-bot.service || true; }
          trap rollback ERR
          python3 - <<'PY'
          from pathlib import Path
          server=Path('server.py').read_text()
          source=Path('/tmp/server.py').read_text()
          begin='TIP_TOPICS = (\n';end='TIPS = [\n'
          if any(text.count(end)!=1 for text in (server,source)) or source.count(begin)!=1:
              raise RuntimeError('Topic anchor changed')
          if begin not in server:
              server=server.replace(end,source[source.index(begin):source.index(end)]+end,1)
          Path('server.py').write_text(server)
          live=Path('notification_delivery.py').read_text()
          source=Path('/tmp/notification_delivery.py').read_text()
          begin='    def make_daily(kind):\n';end="    original_make_daily=s['make_daily']\n"
          if any(text.count(mark)!=1 for text in (live,source) for mark in (begin,end)):
              raise RuntimeError('Live daily generator anchor changed')
          Path('notification_delivery.py').write_text(live[:live.index(begin)]+source[source.index(begin):source.index(end)]+live[live.index(end):])
          PY
          python3 -m py_compile server.py notification_delivery.py
          systemctl restart timecode-bot.service
          healthy=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 3 http://127.0.0.1:8097/health -o /dev/null; then healthy=1;break;fi
            sleep 2
          done
          test "$healthy" = 1
          systemctl is-active --quiet timecode-bot.service
          trap - ERR
          echo 'Daily Kimi tip generator installed'
          REMOTE
