name: Discover server addresses

on:
  workflow_dispatch:
  push:
    branches:
      - boom-kadr-deploy
    paths:
      - '.github/workflows/discover-server-addresses.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and probe existing hosts
        run: |
          hosts="go.1tourtv.ru sale.1tourtv.ru proxy.1tourtv.ru proxy.mityademon.com"
          for host in $hosts; do
            echo "=== $host ==="
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u || true
            curl -4 -k -sS -o /dev/null -w 'HTTP %{http_code} REMOTE %{remote_ip}\n' --connect-timeout 8 --max-time 12 "http://$host/" || true
            curl -4 -k -sS -o /dev/null -w 'HTTPS %{http_code} REMOTE %{remote_ip}\n' --connect-timeout 8 --max-time 12 "https://$host/" || true
          done
