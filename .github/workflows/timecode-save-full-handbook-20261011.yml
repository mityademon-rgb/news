name: Save approved TIMECODE full handbook
on:
  push:
    branches: [boom-kadr-deploy]
    paths: ['.github/workflows/timecode-save-full-handbook-20261011.yml']
permissions:
  contents: read
jobs:
  handbook:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Save only documentation without restarting or changing database
        env:
          BOOM_SSH_KEY: ${{ secrets.BOOM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BOOM_SSH_KEY" > ~/.ssh/timecode
          chmod 600 ~/.ssh/timecode
          ssh-keyscan -T 8 -H 217.149.24.242 > ~/.ssh/known_hosts
          ssh -i ~/.ssh/timecode -o BatchMode=yes -o ConnectTimeout=15 root@217.149.24.242 'python3 -' <<'PY'
          import base64,hashlib,datetime,shutil
          from pathlib import Path
          p=Path('/opt/timecode-bot/timecode-bot/PROJECT_AI_HANDBOOK.md')
          blob=base64.b64decode('')
          assert hashlib.sha256(blob).hexdigest()=='3be94d41d4e51c6e7e311b7ef82fab8d3ea5d8b0e58b21bf0e018ce5ef1a0592'
          if p.exists() and p.read_bytes()!=blob:
              backup=p.with_name('PROJECT_AI_HANDBOOK.before-audit-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')+'.md')
              shutil.copy2(p,backup)
          temp=p.with_suffix('.md.audit-tmp')
          temp.write_bytes(blob)
          temp.chmod(0o644)
          temp.replace(p)
          assert p.read_bytes()==blob
          print('HANDBOOK_SAVED',str(p),len(blob),hashlib.sha256(blob).hexdigest())
          PY
