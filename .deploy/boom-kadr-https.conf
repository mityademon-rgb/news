server {
    listen 80;
    listen [::]:80;
    server_name boom-kadr.217-149-24-234.nip.io;

    root /var/www/boom-kadr;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 217.149.24.234:443 ssl;
    server_name boom-kadr.217-149-24-234.nip.io;

    ssl_certificate /etc/letsencrypt/live/boom-kadr.217-149-24-234.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boom-kadr.217-149-24-234.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/boom-kadr;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|webp|png|jpg|jpeg|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
