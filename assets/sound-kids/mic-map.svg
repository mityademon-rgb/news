<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><rect width="960" height="600" fill="#171422"/><g font-family="sans-serif"><text x="38" y="65" font-size="29" fill="#f4ff37">МИКРОФОН ВЫБИРАЮТ ПОД ЗАДАЧУ</text><rect x="35" y="100" width="890" height="100" rx="15" fill="#30273f"/><text x="58" y="136" font-size="25" fill="#47e1db">01 / РУЧНОЙ</text><text x="58" y="174" font-size="23" fill="white">Говорящий → капсюль рядом</text><rect x="35" y="217" width="890" height="100" rx="15" fill="#30273f"/><text x="58" y="253" font-size="25" fill="#47e1db">02 / ПЕТЛИЧКА</text><text x="58" y="291" font-size="23" fill="white">Одежда закреплена, капсюль свободен</text><rect x="35" y="334" width="890" height="100" rx="15" fill="#30273f"/><text x="58" y="370" font-size="25" fill="#47e1db">03 / ПУШКА</text><text x="58" y="408" font-size="23" fill="white">Над кадром → на рот героя</text><rect x="35" y="451" width="890" height="100" rx="15" fill="#30273f"/><text x="58" y="487" font-size="25" fill="#47e1db">04 / НАКАМЕРНЫЙ</text><text x="58" y="525" font-size="23" fill="white">Общий звук и резерв</text></g></svg>