<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><rect width="1000" height="570" rx="28" fill="#f4efe5"/><text x="40" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#262238">Условия меняют результат</text><rect x="40" y="100" width="440" height="370" rx="22" fill="#e5ddf7"/><text x="64" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#262238">РАСПЛЫВЧАТО</text><text x="64" y="227" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Сделай интересное занятие</text><text x="64" y="309" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">«Введение, теория, практика»</text><text x="64" y="391" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Неясно: что делать руками?</text><rect x="520" y="100" width="440" height="370" rx="22" fill="#d7ecde"/><text x="544" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#262238">КОНКРЕТНО</text><text x="544" y="227" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Бумага, 10–12 лет, 20 минут</text><text x="544" y="309" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">3 формы → композиция → показ</text><text x="544" y="391" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Есть действие и видимый итог</text><text x="40" y="525" font-family="sans-serif" font-size="17" fill="#62596b">Учебный пример TIMECODE · не скриншот и не ответ конкретного сервиса</text></svg>