<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><rect width="1000" height="570" rx="28" fill="#f4efe5"/><text x="40" y="58" font-family="sans-serif" font-size="28" font-weight="700" fill="#262238">Карточка, которую можно сохранить</text><rect x="40" y="100" width="440" height="370" rx="22" fill="#e5ddf7"/><text x="64" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#262238">ИСХОДНЫЕ УСЛОВИЯ</text><text x="64" y="227" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Театр · 12–15 лет · 10 новичков</text><text x="64" y="309" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">60 минут · зал и стулья</text><text x="64" y="391" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Итог: парная сцена 2 минуты</text><rect x="520" y="100" width="440" height="370" rx="22" fill="#d7ecde"/><text x="544" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#262238">ПРИМЕР СТРУКТУРЫ ОТВЕТА</text><text x="544" y="227" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Цель: действовать с партнёром</text><text x="544" y="309" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Практика: сцена без реквизита</text><text x="544" y="391" font-family="sans-serif" font-size="21" font-weight="400" fill="#262238">Проверка: понятны цель и конфликт</text><text x="40" y="525" font-family="sans-serif" font-size="17" fill="#62596b">Учебный пример TIMECODE · не скриншот и не ответ конкретного сервиса</text></svg>