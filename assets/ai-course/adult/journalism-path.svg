<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740"><rect width="1000" height="740" fill="#f4f6f9"/><g font-family="Arial,sans-serif"><text x="50" y="65" fill="#2458ea" font-size="18">TIMECODE / ПРАКТИКА С ПЕРВОГО ДНЯ</text><text x="50" y="125" fill="#17202a" font-size="35" font-weight="bold">От первого вопроса — к своей передаче</text><rect x="50" y="175" width="900" height="105" rx="12" fill="white" stroke="#d4dce4"/><circle cx="95" cy="227" r="24" fill="#2458ea"/><text x="88" y="235" fill="white" font-size="23">1</text><text x="140" y="215" fill="#17202a" font-size="28" font-weight="bold">Замечаем истории</text><text x="140" y="253" fill="#566171" font-size="23">Найдите три темы рядом со своим Домом культуры.</text><rect x="50" y="300" width="900" height="105" rx="12" fill="white" stroke="#d4dce4"/><circle cx="95" cy="352" r="24" fill="#2458ea"/><text x="88" y="360" fill="white" font-size="23">2</text><text x="140" y="340" fill="#17202a" font-size="28" font-weight="bold">Учимся разговаривать</text><text x="140" y="378" fill="#566171" font-size="23">Возьмите первое интервью друг у друга.</text><rect x="50" y="425" width="900" height="105" rx="12" fill="white" stroke="#d4dce4"/><circle cx="95" cy="477" r="24" fill="#2458ea"/><text x="88" y="485" fill="white" font-size="23">3</text><text x="140" y="465" fill="#17202a" font-size="28" font-weight="bold">Снимаем и собираем</text><text x="140" y="503" fill="#566171" font-size="23">Сделайте короткий сюжет на телефон.</text><rect x="50" y="550" width="900" height="105" rx="12" fill="white" stroke="#d4dce4"/><circle cx="95" cy="602" r="24" fill="#2458ea"/><text x="88" y="610" fill="white" font-size="23">4</text><text x="140" y="590" fill="#17202a" font-size="28" font-weight="bold">Работаем редакцией</text><text x="140" y="628" fill="#566171" font-size="23">Придумайте и выпустите свою передачу.</text></g></svg>