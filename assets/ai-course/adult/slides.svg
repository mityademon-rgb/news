<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Шесть экранов, которые ведут занятие"><rect width="1200" height="700" fill="#f5f6f3"/><g font-family="Arial,sans-serif" fill="#17202a"><text x="60" y="70" font-size="17" letter-spacing="3" fill="#2458ea">TIMECODE / КУЛЬТУРНЫЙ КОД</text><text x="60" y="139" font-size="42" font-weight="bold">Шесть экранов, которые ведут занятие</text><text x="60" y="184" font-size="23" fill="#566171">На слайде один смысл. Инструкция крупнее украшений.</text><rect x="60" y="230" width="340" height="166" rx="10" fill="#202a37"/><text x="82" y="277" font-size="20" fill="white">01 / 06</text><text x="82" y="335" font-size="29" fill="white">Вопрос-зацепка</text><rect x="425" y="230" width="340" height="166" rx="10" fill="#e6edff"/><text x="447" y="277" font-size="20" fill="#2458ea">02 / 06</text><text x="447" y="335" font-size="29" fill="#17202a">Понятный пример</text><rect x="790" y="230" width="340" height="166" rx="10" fill="#d5eee5"/><text x="812" y="277" font-size="20" fill="#2458ea">03 / 06</text><text x="812" y="335" font-size="29" fill="#17202a">Правила игры</text><rect x="60" y="423" width="340" height="166" rx="10" fill="#f4e0d1"/><text x="82" y="470" font-size="20" fill="#2458ea">04 / 06</text><text x="82" y="528" font-size="29" fill="#17202a">Практическая проба</text><rect x="425" y="423" width="340" height="166" rx="10" fill="#e7e1f3"/><text x="447" y="470" font-size="20" fill="#2458ea">05 / 06</text><text x="447" y="528" font-size="29" fill="#17202a">Показ и сравнение</text><rect x="790" y="423" width="340" height="166" rx="10" fill="#202a37"/><text x="812" y="470" font-size="20" fill="white">06 / 06</text><text x="812" y="528" font-size="29" fill="white">Что получилось?</text><text x="60" y="668" font-size="17" fill="#566171">Редакционный учебный образец · проверяйте свой результат</text></g></svg>