<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Тон меняется. Факты остаются."><rect width="1200" height="700" fill="#f5f6f3"/><g font-family="Arial,sans-serif" fill="#17202a"><text x="60" y="70" font-size="17" letter-spacing="3" fill="#2458ea">TIMECODE / КУЛЬТУРНЫЙ КОД</text><text x="60" y="139" font-size="42" font-weight="bold">Тон меняется. Факты остаются.</text><text x="60" y="184" font-size="23" fill="#566171">Учебная викторина: 20 участников, 2 раунда, одна игра не состоялась.</text><rect x="60" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="225" width="7" height="164" rx="3" fill="#2458ea"/><text x="85" y="264" font-size="19" fill="#566171">ЗАМЕТКА</text><text x="85" y="309" font-size="29" font-weight="bold">«Два раунда, четыре команды»</text><text x="85" y="350" font-size="20">Записываем конкретные действия</text><rect x="615" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="225" width="7" height="164" rx="3" fill="#16806d"/><text x="640" y="264" font-size="19" fill="#566171">ОТЧЁТ</text><text x="640" y="309" font-size="29" font-weight="bold">«Проведена викторина…»</text><text x="640" y="350" font-size="20">Форма деловая, факты те же</text><rect x="60" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="415" width="7" height="164" rx="3" fill="#bd5e32"/><text x="85" y="454" font-size="19" fill="#566171">ЖУРНАЛ</text><text x="85" y="499" font-size="29" font-weight="bold">Тема + действия + время</text><text x="85" y="540" font-size="20">Короткая запись о проведённом</text><rect x="615" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="415" width="7" height="164" rx="3" fill="#8145ad"/><text x="640" y="454" font-size="19" fill="#566171">ПОСТ</text><text x="640" y="499" font-size="29" font-weight="bold">«Команды спорили о героях»</text><text x="640" y="540" font-size="20">Живой язык без приписок</text><text x="60" y="668" font-size="17" fill="#566171">Редакционный учебный образец · проверяйте свой результат</text></g></svg>