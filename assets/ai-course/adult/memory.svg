<g transform="translate(52 120)"><rect x="35" y="20" width="280" height="210" rx="8" fill="#fff" stroke="#a8b6ce" stroke-width="2"/><path d="M67 63h214M67 88h167M67 127h214M67 152h145M67 191h214" stroke="#c1cbe0" stroke-width="9"/><text x="0" y="295" font-size="34" font-weight="700">Контекст</text><text x="0" y="342" font-size="23">Что учитывается</text><text x="0" y="376" font-size="23">в текущем разговоре</text></g>
