<g transform="translate(965 120)"><rect x="15" y="20" width="320" height="210" rx="8" fill="#fff" stroke="#a8b6ce" stroke-width="2"/><path d="M45 72h160M45 123h160M45 174h160" stroke="#c1cbe0" stroke-width="7"/><rect x="235" y="54" width="64" height="31" rx="16" fill="#2458ea"/><circle cx="283" cy="70" r="12" fill="#fff"/><rect x="235" y="108" width="64" height="31" rx="16" fill="#d3d8e1"/><circle cx="251" cy="124" r="12" fill="#fff"/><text x="0" y="295" font-size="34" font-weight="700">Память</text><text x="0" y="342" font-size="23">Если доступна:</text><text x="0" y="376" font-size="23">настройки и записи</text></g></g><text x="52" y="557" font-family="Arial,sans-serif" font-size="20" fill="#657084">История диалогов сама по себе не означает, что новый чат знает их содержание.</text></svg>
