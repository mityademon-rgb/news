<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="72 академических ≠ 72 обычных часа"><rect width="1200" height="700" fill="#f5f6f3"/><g font-family="Arial,sans-serif" fill="#17202a"><text x="60" y="70" font-size="17" letter-spacing="3" fill="#2458ea">TIMECODE / КУЛЬТУРНЫЙ КОД</text><text x="60" y="139" font-size="42" font-weight="bold">72 академических ≠ 72 обычных часа</text><text x="60" y="184" font-size="23" fill="#566171">Учебный пример КТП. Продолжительность своего занятия уточните в ДК.</text><rect x="60" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="225" width="7" height="164" rx="3" fill="#2458ea"/><text x="85" y="264" font-size="19" fill="#566171">УЧЕБНЫЕ НЕДЕЛИ</text><text x="85" y="309" font-size="29" font-weight="bold">36 × 2 занятия</text><text x="85" y="350" font-size="20">72 встречи за учебный год</text><rect x="615" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="225" width="7" height="164" rx="3" fill="#16806d"/><text x="640" y="264" font-size="19" fill="#566171">ПРОДОЛЖИТЕЛЬНОСТЬ</text><text x="640" y="309" font-size="29" font-weight="bold">72 × 45 минут</text><text x="640" y="350" font-size="20">3 240 минут занятий</text><rect x="60" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="415" width="7" height="164" rx="3" fill="#bd5e32"/><text x="85" y="454" font-size="19" fill="#566171">АКАДЕМИЧЕСКИЕ ЧАСЫ</text><text x="85" y="499" font-size="29" font-weight="bold">3 240 ÷ 45 = 72</text><text x="85" y="540" font-size="20">Один академический час = 45 минут</text><rect x="615" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="415" width="7" height="164" rx="3" fill="#8145ad"/><text x="640" y="454" font-size="19" fill="#566171">АСТРОНОМИЧЕСКИЕ ЧАСЫ</text><text x="640" y="499" font-size="29" font-weight="bold">3 240 ÷ 60 = 54</text><text x="640" y="540" font-size="20">Один астрономический час = 60 минут</text><text x="60" y="668" font-size="17" fill="#566171">Редакционный учебный образец · проверяйте свой результат</text></g></svg>