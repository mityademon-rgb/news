<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Не перепечатываем. Переносим."><rect width="1200" height="700" fill="#f5f6f3"/><g font-family="Arial,sans-serif" fill="#17202a"><text x="60" y="70" font-size="17" letter-spacing="3" fill="#2458ea">TIMECODE / КУЛЬТУРНЫЙ КОД</text><text x="60" y="139" font-size="42" font-weight="bold">Не перепечатываем. Переносим.</text><text x="60" y="184" font-size="23" fill="#566171">Копируем только таблицу. Затем проверяем ячейки и суммы.</text><rect x="60" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="225" width="7" height="164" rx="3" fill="#2458ea"/><text x="85" y="264" font-size="19" fill="#566171">1 / ЧАТ</text><text x="85" y="309" font-size="29" font-weight="bold">Согласованная таблица</text><text x="85" y="350" font-size="20">36 недель, правильные единицы</text><rect x="615" y="225" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="225" width="7" height="164" rx="3" fill="#16806d"/><text x="640" y="264" font-size="19" fill="#566171">2 / ЕСЛИ СТОЛБЦЫ СЪЕХАЛИ</text><text x="640" y="309" font-size="29" font-weight="bold">Попросить TSV</text><text x="640" y="350" font-size="20">Колонки разделены табуляцией</text><rect x="60" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="60" y="415" width="7" height="164" rx="3" fill="#bd5e32"/><text x="85" y="454" font-size="19" fill="#566171">3 / РЕДАКТОР</text><text x="85" y="499" font-size="29" font-weight="bold">Вставить в A1</text><text x="85" y="540" font-size="20">При необходимости импорт текста</text><rect x="615" y="415" width="525" height="164" rx="12" fill="white" stroke="#d4dce4"/><rect x="615" y="415" width="7" height="164" rx="3" fill="#8145ad"/><text x="640" y="454" font-size="19" fill="#566171">4 / ПРОВЕРКА</text><text x="640" y="499" font-size="29" font-weight="bold">Строки и часы сошлись?</text><text x="640" y="540" font-size="20">Сохранить рабочий файл и копию</text><text x="60" y="668" font-size="17" fill="#566171">Редакционный учебный образец · проверяйте свой результат</text></g></svg>